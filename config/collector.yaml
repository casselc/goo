receivers:
  otlp:
    protocols:
      grpc: {endpoint: '0.0.0.0:4317'}
      http: {endpoint: '0.0.0.0:4318'}
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 1s
    send_batch_size: 1000
exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s
    username: lab
    password: lab-local
    database: default
    create_schema: true
    async_insert: false
    ttl: 24h
    logs_table_name: otel_logs
    traces_table_name: otel_traces
    metrics_tables:
      gauge: {name: otel_metrics_gauge}
      sum: {name: otel_metrics_sum}
      histogram: {name: otel_metrics_histogram}
      exponential_histogram: {name: otel_metrics_exp_histogram}
      summary: {name: otel_metrics_summary}
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 120s
service:
  pipelines:
    logs: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [clickhouse]}
    traces: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [clickhouse]}
    metrics: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [clickhouse]}
