apiVersion: goo/telemetry-package/v1alpha1
name: checkout-logs
title: Go checkout logs
description: Captured records only. Retries, sampling and completeness remain unknown.
  This package does not infer business outcomes.
source:
  adapter: clickhouse.otel/v1
  signal: logs
  environment: local
where:
  field:
    kind: column
    key: service
  op: eq
  value: lab-go-checkout
groupBy:
- kind: column
  key: severity
measure: captured-record-count
lookbackMinutes: 5
views:
- records
- distribution
- trace-context
bucketMs: 10000
