apiVersion: goo/telemetry-package/v1alpha1
name: reservations-spans
title: Reservation pipeline spans
description: Captured records only. Retries, sampling and completeness remain unknown.
  This package does not infer business outcomes.
source:
  adapter: clickhouse.otel/v1
  signal: spans
  environment: local
where:
  any:
  - field:
      kind: column
      key: service
    op: eq
    value: lab-web
  - field:
      kind: column
      key: service
    op: eq
    value: lab-grpc
  - field:
      kind: column
      key: service
    op: eq
    value: lab-consumer
groupBy:
- kind: column
  key: name
measure: captured-record-count
lookbackMinutes: 5
views:
- records
- distribution
- trace-context
bucketMs: 10000
summary: span-duration
spanStatus: true
