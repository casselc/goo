    expect: 'selected == {{.obs.selected}} and basis == {{.obs.basis}}'
  select_cell:
    expect: 'selected == {{.obs.selected}} and basis == {{.obs.basis}}'
  open_trace:
    expect: 'selected == {{.obs.selected}} and basis == {{.obs.basis}}'
  follow_subject:
    expect: 'selected == {{.obs.selected}} and basis == {{.obs.basis}}'
  reset:
    expect: 'selected == {{.obs.selected}} and basis == {{.obs.basis}}'
