    expect: 'generation == {{.obs.generation}} and phase == {{.obs.phase}} and coherent == {{.obs.coherent}}'
  publish:
    expect: 'generation == {{.obs.generation}} and phase == {{.obs.phase}} and coherent == {{.obs.coherent}}'
  reject:
    expect: 'generation == {{.obs.generation}} and phase == {{.obs.phase}} and coherent == {{.obs.coherent}}'
  cancel:
    expect: 'generation == {{.obs.generation}} and phase == {{.obs.phase}} and coherent == {{.obs.coherent}}'
  failedRead:
    expect: 'generation == {{.obs.generation}} and phase == {{.obs.phase}} and coherent == {{.obs.coherent}}'
