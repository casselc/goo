  observe_stage:
    expect: 'coherent == {{.obs.coherent}} and source == {{.obs.source}}'
  observe_search:
    expect: 'coherent == {{.obs.coherent}} and source == {{.obs.source}}'
  observe_witness_details:
    expect: 'coherent == {{.obs.coherent}} and source == {{.obs.source}}'
  observe_open_cross:
    expect: 'coherent == {{.obs.coherent}} and source == {{.obs.source}}'
  observe_pin_cross:
    expect: 'coherent == {{.obs.coherent}} and source == {{.obs.source}}'
  observe_open_same:
    expect: 'coherent == {{.obs.coherent}} and source == {{.obs.source}}'
  observe_compare:
    expect: 'coherent == {{.obs.coherent}} and source == {{.obs.source}}'
  observe_open_repeated:
    expect: 'coherent == {{.obs.coherent}} and source == {{.obs.source}}'
  observe_next_trace_page:
    expect: 'coherent == {{.obs.coherent}} and source == {{.obs.source}}'
