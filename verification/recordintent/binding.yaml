  run_intent: {expect: 'phase == {{.obs.phase}} and reads == {{.obs.reads}} and held == {{.obs.held}}'}
  refuse_intent: {expect: 'phase == {{.obs.phase}} and reads == {{.obs.reads}} and held == {{.obs.held}}'}
